<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.style=localStorage.getItem("johnston-style")||"default"}catch(e){document.documentElement.dataset.style="default"}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8E4E9">
<meta name="apple-mobile-web-app-title" content="Dinners">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Dinners we’ve made</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Damion&family=Josefin+Sans:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;500;700&display=swap">
<style>
  :root{--bg:#F8E4E9;--card:#FFF7F4;--ink:#1E1A1C;--muted:#6E5F66;--lilac:#B9B8E6;--wave:#E9A6D6;--peach:#F5A68D;--chart:#D6CD6B;--line:#F0D3DA;
    --script:Damion,"Brush Script MT",cursive;--caps:"Josefin Sans",Futura,sans-serif;--sans:"DM Sans","Helvetica Neue",Arial,sans-serif;color-scheme:light}
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--ink)}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
  input,select,textarea{font:inherit;color:var(--ink)}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
  @media (pointer:coarse){input,select,textarea{font-size:16px}}
  .wrap{max-width:1180px;margin:0 auto;padding:clamp(14px,3vw,24px) clamp(14px,3vw,32px) 64px;display:flex;flex-direction:column;gap:20px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .top .l{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .back{font-size:13.5px;font-weight:600;text-decoration:none}
  .logo{display:flex;align-items:baseline;gap:10px}
  .logo .s{font-family:var(--script);font-size:46px;line-height:.8}
  .caps{font-family:var(--caps);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  nav.main{display:flex;gap:6px;flex-wrap:wrap}
  nav.main button{font-family:var(--caps);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px;padding:8px 14px;border-radius:999px;min-height:38px}
  nav.main button[aria-current="page"]{background:var(--ink);color:var(--card)}
  .band{position:relative;height:110px;border-radius:22px;overflow:hidden}
  .band svg{position:absolute;inset:0;width:100%;height:100%}
  .band .t{position:absolute;left:28px;right:28px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .band .sc{font-family:var(--script);font-size:30px}
  .grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:24px;padding:18px 20px}
  .peach{background:var(--peach);border-radius:24px;padding:20px 22px}
  .chart{background:var(--chart);border-radius:24px;padding:18px 20px}
  h2.h{margin:0;font-family:var(--caps);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px}
  .scr{font-family:var(--script);font-size:28px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--lilac);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;margin:2px 4px 2px 0;min-height:30px}
  .chip.on{background:var(--ink);color:var(--card)}
  .chip.occ{background:var(--chart)}
  .idea{display:inline-block;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:13.5px;margin:3px 4px 3px 0}
  .row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1.5px solid var(--line);align-items:start}
  .row .d{font-family:var(--caps);font-weight:700;letter-spacing:.1em;font-size:12px;color:var(--muted);padding-top:3px}
  .row .m{font-weight:600}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .linkbtn{text-decoration:underline;font-size:13.5px;font-weight:600;min-height:32px;display:inline-flex;align-items:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--card);font-weight:600}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .in{min-height:44px;border-radius:14px;border:1.5px solid #E2C2CC;background:#fff;padding:8px 12px;width:100%}
  textarea.in{min-height:90px;resize:vertical}
  .guests{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
  .gcard{background:var(--card);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;box-shadow:inset 0 0 0 1.5px var(--lilac)}
  .gcard:nth-child(4n+2){box-shadow:inset 0 0 0 1.5px var(--peach)}.gcard:nth-child(4n+3){box-shadow:inset 0 0 0 1.5px var(--chart)}.gcard:nth-child(4n){box-shadow:inset 0 0 0 1.5px var(--wave)}
  .stripes{background-color:var(--card);background-image:repeating-linear-gradient(90deg,var(--lilac) 0 2px,transparent 2px 22px);border-radius:24px;padding:14px}
  .stripes > div{background:var(--bg);border-radius:18px;padding:16px}
  .diet{background:var(--card);border-radius:14px;padding:9px 14px;margin:0 0 14px;font-size:13.5px}
  .warn{color:#8A2B1C;font-weight:600}
  .msg{background:var(--chart);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px}
  .gate{max-width:460px;margin:14vh auto;text-align:center}
  .modal-bg{position:fixed;inset:0;background:rgba(30,26,28,.35);z-index:30}
  .modal{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px}
  .modal label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px;max-height:220px;overflow:auto;border:1.5px solid #E2C2CC;border-radius:14px;padding:8px 10px;background:#fff}
  .checks label{flex-direction:row;align-items:center;gap:8px;font-weight:500;font-size:14px;min-height:32px}
  table.dishes{width:100%;border-collapse:collapse;font-size:14.5px}
  table.dishes th{text-align:left;font-family:var(--caps);font-size:12px;letter-spacing:.1em;padding:8px 6px;border-bottom:1.5px solid var(--ink)}
  table.dishes td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .foot{text-align:center;font-size:13px;color:var(--muted)}
  .style-btn{text-decoration:underline;text-underline-offset:3px}
  .style-btn[aria-pressed="true"]{text-decoration:none;font-weight:700;cursor:default}

  /* ===== Classic green (Nathan's style) ===== */
  [data-style="green"]{--bg:#F7F5F1;--card:transparent;--ink:#1F2420;--muted:#6B6F66;--lilac:#ECE7DD;--wave:#ECE7DD;--peach:#ECE7DD;--chart:#ECE7DD;--line:#CFC9BC;
    --script:"Cormorant Garamond",Georgia,serif;--caps:Karla,"Helvetica Neue",Arial,sans-serif;--sans:Karla,"Helvetica Neue",Arial,sans-serif}
  [data-style="green"] .logo .s{font-weight:400;font-size:clamp(46px,7vw,70px);letter-spacing:-.015em}
  [data-style="green"] .top{border-bottom:1px solid #1F2420;padding-bottom:16px}
  [data-style="green"] nav.main button{border-radius:0;font-weight:500;letter-spacing:0;text-transform:none;font-size:14px;border-bottom:2px solid transparent;padding:4px 0;margin-right:14px}
  [data-style="green"] nav.main button[aria-current="page"]{background:none;color:#1F2420;border-bottom-color:#4F5E43}
  [data-style="green"] .band{display:none}
  [data-style="green"] .card,[data-style="green"] .peach,[data-style="green"] .chart{border-radius:0;border-top:1px solid #1F2420;padding:12px 0;background:none}
  [data-style="green"] .chart{background:#ECE7DD;padding:16px 18px;border-top:0}
  [data-style="green"] h2.h{font-size:11.5px;letter-spacing:.16em}
  [data-style="green"] .scr{font-style:italic;color:#6B6F66;font-size:20px}
  [data-style="green"] .chip,[data-style="green"] .idea,[data-style="green"] .btn,[data-style="green"] .in,[data-style="green"] .gcard,[data-style="green"] .modal,[data-style="green"] .diet,[data-style="green"] .msg,[data-style="green"] .checks{border-radius:0}
  [data-style="green"] .chip.on,[data-style="green"] .btn{background:#4F5E43;color:#F7F5F1}
  [data-style="green"] .btn.ghost{background:transparent;color:#1F2420}
  [data-style="green"] .gcard{box-shadow:none!important;border-bottom:1px solid #CFC9BC}
  [data-style="green"] .stripes{background:none;padding:0;border-radius:0;border-top:1px solid #1F2420}
  [data-style="green"] .stripes > div{background:none;padding:12px 0;border-radius:0}
  [data-style="green"] .modal{background:#F7F5F1}
  [data-style="green"] .diet{background:#ECE7DD}
</style>
</head>
<body>
<div id="app" class="wrap"><p>Loading…</p></div>
<script src="../firebase-config.js"></script>
<script type="module">
import * as F from '../family.js';
import { SEED_GUESTS, SEED_MEALS } from './seed.js';
const {esc, uid} = F;
const OCCASIONS = ['Dinner','Lunch','Brunch','Christmas Eve','Christmas Day','Easter','Birthday','Other'];
const S = {status:'loading', user:null, guests:[], meals:[], view:'coming', sel:new Set(), q:'', ui:{}, msg:''};

const fmt = iso => iso ? new Date(iso+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric', month:'short', year:'numeric'}) : '';
const mon = iso => iso ? new Date(iso+'T00:00:00').toLocaleDateString('en-AU',{month:'short', year:'numeric'}) : '';
const gName = id => (S.guests.find(g=>g.id===id)||{name:'(removed guest)'}).name;
const dishKey = d => String(d).toLowerCase().replace(/\b(spaghetti|fettuccine|fettucine)\b/g,'').replace('bolognaise','bolognese').replace(/[^a-z0-9]+/g,' ').trim();
const byDate = (a,b) => (b.date||'').localeCompare(a.date||'');
function stats(){
  const count = {}, last = {}, dishes = {};
  S.meals.forEach(m=>{ (m.guests||[]).forEach(g=>{ count[g]=(count[g]||0)+1; if(!last[g] || m.date>last[g]) last[g]=m.date; });
    (m.dishes||[]).forEach(d=>{ const k=dishKey(d); const x = dishes[k] || (dishes[k]={name:d, n:0, last:'', who:new Set()}); x.n++; if(m.date>x.last){ x.last=m.date; x.name=d; } (m.guests||[]).forEach(g=>x.who.add(g)); }); });
  return {count, last, dishes:Object.values(dishes).sort((a,b)=>b.n-a.n || b.last.localeCompare(a.last))};
}
// Simple word check of a guest's dietary notes against a dish name ("no mushrooms" flags "Porcini Mushroom Pasta")
const DIET_WORDS = {mushroom:['mushroom','porcini','shiitake'], seafood:['prawn','shrimp','fish','salmon','tuna','crab','lobster','mussel','oyster','calamari','squid','seafood','barramundi'], fish:['fish','salmon','tuna','barramundi','cod'], prawn:['prawn','shrimp'], nut:['nut','peanut','satay','almond','cashew','pesto','walnut','pecan'], peanut:['peanut','satay'], pork:['pork','bacon','ham','chorizo','prosciutto','pancetta','pulled pork','sausage'], beef:['beef','steak','mince','bolognese','burger'], dairy:['cheese','cream','butter','milk','feta','parmesan','carbonara','custard','yoghurt'], gluten:['pasta','bread','bun','burger','pizza','noodle','wrap','bagel','pastry','crumble','brownie','cake','bao','gnocchi'], egg:['egg','carbonara','custard','aioli','mayo'], chilli:['chilli','spicy','hot honey','jalapeno']};
function dietClash(guestIds, dish){
  const d = String(dish).toLowerCase(), out = [];
  guestIds.forEach(id=>{ const g = S.guests.find(x=>x.id===id); if(!g || !g.dietary) return; const notes = g.dietary.toLowerCase();
    Object.entries(DIET_WORDS).forEach(([k,words])=>{ if(notes.includes(k) && words.some(w=>d.includes(w))) out.push(g.name); });
    if(/vegetarian|vegan/.test(notes) && DIET_WORDS.beef.concat(DIET_WORDS.pork, ['chicken','lamb','fish','prawn','salmon','turkey']).some(w=>d.includes(w))) out.push(g.name); });
  return [...new Set(out)];
}

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
function typing(){ const a=document.activeElement; return a && a.closest && a.closest('#app') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); }
let pending=false;
function liveRender(){ if(typing()){ pending=true; return; } render(); }
document.addEventListener('focusout', ()=>setTimeout(()=>{ if(pending && !typing()){ pending=false; render(); } }, 150));
const WAVE = `<svg aria-hidden="true" viewBox="0 0 1200 120" preserveAspectRatio="none"><rect width="1200" height="120" fill="#B9B8E6"/><path d="M0 40 C 150 0, 300 0, 450 40 S 750 80, 900 40 S 1150 0, 1200 30 L1200 0 L0 0 Z" fill="#F8E4E9"/><path d="M0 40 C 150 0, 300 0, 450 40 S 750 80, 900 40 S 1150 0, 1200 30" fill="none" stroke="#E9A6D6" stroke-width="16"/></svg>`;
function burst(){ let p=''; for(let i=0;i<28;i++){ const r=i%2?32:52, a=Math.PI*i/14; p+=`${(55+r*Math.cos(a)).toFixed(1)},${(55+r*Math.sin(a)).toFixed(1)} `; } return `<svg width="110" height="110" viewBox="0 0 110 110" aria-hidden="true" class="p-burst"><polygon points="${p}" fill="var(--chart)"/></svg>`; }

function render(){
  const app = $('app');
  if(S.status==='loading'){ app.innerHTML='<p>Loading…</p>'; return; }
  if(S.status!=='ready'){
    app.innerHTML = `<div class="gate"><p class="logo" style="justify-content:center"><span class="s">Dinners</span><span class="caps small">we’ve made</span></p>${S.status==='noConfig'?'<p>The Firebase settings file wasn’t found. This folder needs to sit inside the dashboard site.</p>'
      : S.status==='denied' ? `<p>${esc(S.user&&S.user.email)} doesn’t have access. Sign out and use your family Google account.</p><button class="btn" onclick="D.signOut()">Sign out</button>`
      : `<p>Sign in with your family Google account.</p><button class="btn" onclick="D.signIn()">Sign in with Google</button>`}<p><a href="?demo">Or look around a demo</a></p></div>`;
    return;
  }
  const st = stats();
  const firstYear = S.meals.length ? S.meals.map(m=>m.date).filter(Boolean).sort()[0] : '';
  const nav = [['coming','Who’s coming?'],['dinners','Dinners'],['guests','Guests'],['occasions','Occasions'],['dishes','Dishes']];
  app.innerHTML = `
  <header class="top"><div class="l"><a class="back" href="../">← Dashboard</a><span class="logo"><span class="s">Dinners</span><span class="caps small">we’ve made</span></span></div>
    <nav class="main" aria-label="Sections">${nav.map(([k,l])=>`<button ${S.view===k?'aria-current="page"':''} onclick="D.view('${k}')">${l}</button>`).join('')}</nav></header>
  ${S.msg?`<div class="msg" role="status"><span>${esc(S.msg)}</span><button class="linkbtn" onclick="D.clear()">OK</button></div>`:''}
  <div class="band" aria-hidden="true">${WAVE}<div class="t"><span class="caps" style="font-size:14px">${S.meals.length} meals · ${S.guests.length} guests${firstYear?` · since ${mon(firstYear)}`:''}</span><span class="sc">made with heart</span></div></div>
  ${S.view==='coming' ? pageComing(st) : S.view==='dinners' ? pageDinners() : S.view==='guests' ? pageGuests(st) : S.view==='occasions' ? pageOccasions() : pageDishes(st)}
  <p class="foot">${F.DEMO?'Demo: nothing is saved':esc(S.user.email)} · <button class="linkbtn" style="font-size:13px" onclick="D.signOut()">Sign out</button> · ${F.stylePicker()}</p>
  ${S.ui.modal?S.ui.modal():''}`;
  document.querySelectorAll('[data-style-pick]').forEach(b=>b.onclick=()=>{ F.saveStyle(S.user && S.user.email, b.dataset.stylePick); render(); });
}
function mealRow(m, actions=true){
  return `<div class="row"><span class="d">${esc(fmt(m.date))}</span><span><span class="m">${esc((m.dishes||[]).join(' + '))}</span><br>${(m.guests||[]).map(g=>`<span class="chip">${esc(gName(g))}</span>`).join('')}${m.occasion && m.occasion!=='Dinner'?`<span class="chip occ">${esc(m.occasion)}</span>`:''}${m.notes?`<span class="small muted" style="display:block">${esc(m.notes)}</span>`:''}</span>
    ${actions?`<button class="linkbtn" onclick="D.mealForm('${m.id}')">Edit</button>`:'<span></span>'}</div>`;
}
function pageComing(st){
  const sel = [...S.sel];
  const guestsSorted = S.guests.slice().sort((a,b)=>(st.count[b.id]||0)-(st.count[a.id]||0) || a.name.localeCompare(b.name));
  const before = S.meals.filter(m=>(m.guests||[]).some(g=>S.sel.has(g))).sort(byDate);
  const madeForThem = new Set(before.flatMap(m=>(m.dishes||[]).map(dishKey)));
  const ideas = st.dishes.filter(x=>!madeForThem.has(dishKey(x.name))).slice(0,12);
  const diets = sel.map(id=>S.guests.find(g=>g.id===id)).filter(g=>g && g.dietary);
  const xmas = S.meals.filter(m=>/christmas/i.test(m.occasion||'')).sort(byDate);
  const top = st.dishes[0];
  return `<div class="grid2">
    <section class="peach" aria-labelledby="wc-h">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h2 class="h" id="wc-h">Who’s coming?</h2><span class="scr">so we don’t repeat ourselves</span></div>
      <div style="margin:10px 0 12px">${guestsSorted.map(g=>`<button class="chip ${S.sel.has(g.id)?'on':''}" aria-pressed="${S.sel.has(g.id)}" onclick="D.toggle('${g.id}')">${esc(g.name)}${S.sel.has(g.id)?' ✓':''}</button>`).join('')}</div>
      ${!sel.length ? `<p style="margin:0">Tap who’s coming to see what you’ve made for them before, and ideas that would be new for them.</p>` : `
      ${diets.length?`<div class="diet"><b class="caps small">Dietary</b> ${diets.map(g=>`<span style="margin-right:12px"><b>${esc(g.name)}:</b> ${esc(g.dietary)}</span>`).join('')}</div>`:''}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
        <div class="card" style="padding:12px 14px"><span class="caps small">Made for them before (${before.length})</span>
          ${before.slice(0,S.ui.allBefore?999:8).map(m=>`<div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px"><span class="muted">${esc(fmt(m.date))}</span><span>${esc((m.dishes||[]).join(' + '))}${sel.length>1?`<span class="small muted" style="display:block">${esc((m.guests||[]).filter(g=>S.sel.has(g)).map(gName).join(', '))}</span>`:''}</span></div>`).join('') || '<p class="muted small">Nothing yet. Everything is new for them! ✨</p>'}
          ${before.length>8?`<button class="linkbtn" onclick="D.ui('allBefore',${!S.ui.allBefore})">${S.ui.allBefore?'Show fewer':`See all ${before.length}`}</button>`:''}</div>
        <div><span class="caps small">New for them</span><p style="margin:4px 0 8px;font-size:13px">Dishes you’ve made for others, but never for ${esc(sel.map(gName).join(' or '))}:</p>
          ${ideas.map(x=>{ const c=dietClash(sel, x.name); return `<span class="idea">${c.length?'⚠️':'✨'} ${esc(x.name)}${c.length?` <span class="warn small">(check: ${esc(c.join(', '))})</span>`:''}</span>`; }).join('') || '<p class="small">You’ve made them everything already!</p>'}
          <p style="margin:12px 0 0;font-size:13px">Planning it? In the meal planner, tick <b>+ Guests</b> on that day and choose who’s coming. It’ll be recorded here automatically.</p></div>
      </div>`}
    </section>
    <aside style="display:flex;flex-direction:column;gap:20px">
      ${top?`<section class="card" style="display:flex;gap:14px;align-items:center" aria-label="Most made">${burst()}<div><span class="caps small">Most made</span><span style="display:block;font-family:var(--script);font-size:30px;line-height:1.05">${esc(top.name)}</span><span class="small muted">${top.n} times${st.dishes[1]?` · then ${esc(st.dishes[1].name)} (${st.dishes[1].n})`:''}</span></div></section>`:''}
      <section class="chart" aria-labelledby="x-h"><h2 class="h" id="x-h">Christmas</h2>
        ${xmas.map(m=>`<div style="padding:8px 0;border-bottom:1px dashed rgba(30,26,28,.25)"><span class="caps small">${esc(m.occasion)} ${esc((m.date||'').slice(0,4))}</span><span style="display:block;font-size:14.5px;font-weight:600">${esc((m.dishes||[]).join(' + '))}</span><span class="small">${esc((m.guests||[]).map(gName).join(', '))}</span></div>`).join('') || '<p class="small">No Christmas meals recorded yet.</p>'}</section>
    </aside></div>
  <section class="stripes" aria-labelledby="g-h"><div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px"><h2 class="h" id="g-h">Guests</h2><button class="linkbtn" onclick="D.guestForm()">+ Add a guest</button></div>
    <div class="guests">${guestsSorted.map(g=>gCard(g, st)).join('')}</div></div></section>`;
}
function gCard(g, st){
  const n = st.count[g.id]||0;
  return `<button class="gcard" onclick="D.guestForm('${g.id}')"><strong style="font-size:14px;line-height:1.25">${esc(g.name)}</strong>${g.dietary?'<span style="font-size:11.5px;font-weight:600">🥗 dietary notes</span>':''}<span class="small muted" style="font-size:12px">${n} meal${n===1?'':'s'}${st.last[g.id]?` · last ${esc(mon(st.last[g.id]))}`:''}</span></button>`;
}
function pageDinners(){
  const q = S.q.trim().toLowerCase();
  const list = S.meals.filter(m=>!q || (m.dishes||[]).join(' ').toLowerCase().includes(q) || (m.guests||[]).map(gName).join(' ').toLowerCase().includes(q) || (m.occasion||'').toLowerCase().includes(q)).sort(byDate);
  return `<section class="card" aria-labelledby="d-h"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 class="h" id="d-h">All meals (${list.length})</h2>
    <div style="display:flex;gap:8px;flex:1 1 280px;max-width:460px"><input id="q" class="in" placeholder="Search a dish, guest or occasion" value="${esc(S.q)}" oninput="D.search(this.value)" aria-label="Search"><button class="btn" onclick="D.mealForm()">+ Add</button></div></div>
    ${list.map(m=>mealRow(m)).join('') || '<p class="muted">Nothing matches.</p>'}</section>`;
}
function pageGuests(st){
  const list = S.guests.slice().sort((a,b)=>a.name.localeCompare(b.name));
  return `<section class="stripes" aria-labelledby="g2-h"><div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px"><h2 class="h" id="g2-h">Guests (${list.length})</h2><button class="linkbtn" onclick="D.guestForm()">+ Add a guest</button></div>
    <p class="small muted" style="margin:0 0 10px">Tap a guest to edit their name or dietary notes.</p><div class="guests">${list.map(g=>gCard(g, st)).join('')}</div></div></section>`;
}
function pageOccasions(){
  const groups = {};
  S.meals.filter(m=>m.occasion && m.occasion!=='Dinner').forEach(m=>{ (groups[m.occasion]=groups[m.occasion]||[]).push(m); });
  const keys = Object.keys(groups).sort((a,b)=>OCCASIONS.indexOf(a)-OCCASIONS.indexOf(b));
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start">${keys.map(k=>`<section class="card"><h2 class="h">${esc(k)}</h2>${groups[k].sort(byDate).map(m=>mealRow(m)).join('')}</section>`).join('') || '<section class="card"><p class="muted">No special occasions recorded yet. Choose an occasion when you add a meal.</p></section>'}</div>`;
}
function pageDishes(st){
  return `<section class="card" aria-labelledby="ds-h"><h2 class="h" id="ds-h">Dishes (${st.dishes.length})</h2>
    <div style="overflow-x:auto"><table class="dishes"><thead><tr><th>Dish</th><th>Times</th><th>Last made</th><th>Made for</th></tr></thead>
    <tbody>${st.dishes.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.n}</td><td>${esc(fmt(x.last))}</td><td class="small">${esc([...x.who].map(gName).join(', '))}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ---------- Forms ---------- */
function mealForm(id){
  const m = S.meals.find(x=>x.id===id) || {date:F.isoDate(new Date()), occasion:'Dinner', guests:[...S.sel], dishes:[], notes:''};
  S.ui.modal = () => `<div class="modal-bg" onclick="D.close()"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mf-h">
    <h2 class="h" id="mf-h">${id?'Edit meal':'Add a meal'}</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Date<input id="mf-d" class="in" type="date" value="${esc(m.date)}"></label>
      <label>Occasion<select id="mf-o" class="in">${OCCASIONS.map(o=>`<option ${o===m.occasion?'selected':''}>${o}</option>`).join('')}</select></label></div>
    <div><b style="font-size:14px">Who came</b><div class="checks">${S.guests.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(g=>`<label><input type="checkbox" class="mf-g" value="${g.id}" ${(m.guests||[]).includes(g.id)?'checked':''}> ${esc(g.name)}</label>`).join('')}</div></div>
    <label>What you made (one per line)<textarea id="mf-x" class="in" placeholder="Thai Green Curry&#10;Pavlova">${esc((m.dishes||[]).join('\n'))}</textarea></label>
    <label>Notes<input id="mf-n" class="in" value="${esc(m.notes||'')}" placeholder="e.g. loved the pavlova!"></label>
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">${id?`<button class="linkbtn" onclick="D.delMeal('${id}')">Delete meal</button>`:'<span></span>'}
      <span style="display:flex;gap:10px"><button class="btn ghost" onclick="D.close()">Cancel</button><button class="btn" onclick="D.saveMeal('${id||''}')">Save</button></span></div></div>`;
  render();
}
function guestForm(id){
  const g = S.guests.find(x=>x.id===id) || {name:'', dietary:''};
  S.ui.modal = () => `<div class="modal-bg" onclick="D.close()"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="gf-h">
    <h2 class="h" id="gf-h">${id?'Edit guest':'Add a guest'}</h2>
    <label>Name<input id="gf-n" class="in" value="${esc(g.name)}" placeholder="e.g. Kelsey & Josh"></label>
    <label>Dietary notes<textarea id="gf-d" class="in" placeholder="e.g. Marty: no mushrooms. Kelsey: vegetarian.">${esc(g.dietary||'')}</textarea></label>
    <p class="small muted" style="margin:0">Words like “mushrooms”, “seafood”, “nuts”, “gluten”, “dairy” or “vegetarian” flag matching dishes. It’s a handy reminder, not a guarantee: always double-check recipes for allergies.</p>
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">${id?`<button class="linkbtn" onclick="D.delGuest('${id}')">Remove guest</button>`:'<span></span>'}
      <span style="display:flex;gap:10px"><button class="btn ghost" onclick="D.close()">Cancel</button><button class="btn" onclick="D.saveGuest('${id||''}')">Save</button></span></div></div>`;
  render();
}

/* ---------- Actions ---------- */
const val = id => ($(id)||{}).value || '';
const safe = p => p.catch(e=>{ S.msg = e && e.code==='permission-denied' ? "Couldn't save: check the database rules (see the setup guide)." : "Couldn't save that. Check the internet connection."; render(); });
window.D = {
  signIn: ()=>F.signIn().catch(e=>{ S.msg=`Sign-in didn't work (${e.code}).`; render(); }),
  signOut: ()=>F.logOut(),
  clear: ()=>{ S.msg=''; render(); },
  close: ()=>{ S.ui.modal=null; render(); },
  ui: (k,v)=>{ S.ui[k]=v; render(); },
  view: v=>{ S.view=v; S.ui={}; location.hash=v; render(); window.scrollTo(0,0); },
  toggle: id=>{ S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); S.ui.allBefore=false; render(); },
  search: q=>{ S.q=q; render(); const e=$('q'); if(e){ e.focus(); e.setSelectionRange(q.length,q.length); } },
  mealForm, guestForm,
  saveMeal: id=>{ const dishes=val('mf-x').split('\n').map(s=>s.trim()).filter(Boolean); const date=val('mf-d');
    if(!date || !dishes.length){ alert('Add a date and at least one dish.'); return; }
    const old=S.meals.find(m=>m.id===id)||{source:'manual'};
    safe(F.put('dinners_meals',{...old, id:id||uid('m'), date, occasion:val('mf-o'), guests:[...document.querySelectorAll('.mf-g')].filter(c=>c.checked).map(c=>c.value), dishes, notes:val('mf-n').trim()})); S.ui.modal=null; render(); },
  delMeal: id=>{ if(confirm('Delete this meal?')){ safe(F.remove('dinners_meals', id)); S.ui.modal=null; render(); } },
  saveGuest: id=>{ const name=val('gf-n').trim(); if(!name){ alert('Add a name.'); return; } const old=S.guests.find(g=>g.id===id)||{order:Date.now()};
    safe(F.put('dinners_guests',{...old, id:id||uid('g'), name, dietary:val('gf-d').trim()})); S.ui.modal=null; render(); },
  delGuest: id=>{ const n=S.meals.filter(m=>(m.guests||[]).includes(id)).length; if(!confirm(n?`Remove this guest? They're on ${n} meal${n===1?'':'s'}, which will keep the dishes but lose their name.`:'Remove this guest?')) return; safe(F.remove('dinners_guests', id)); S.sel.delete(id); S.ui.modal=null; render(); }
};

/* ---------- Start ---------- */
const startView = location.hash.slice(1); if(['coming','dinners','guests','occasions','dishes'].includes(startView)) S.view = startView;
F.watchUser(async (u, why)=>{
  if(why==='noConfig'){ S.status='noConfig'; render(); return; }
  S.user=u;
  if(!u){ S.status='signedOut'; render(); return; }
  S.status='ready'; render();
  F.loadStyle(u.email).then(render);
  try{ await F.seedOnce('dinners-seeded', [['dinners_guests', SEED_GUESTS], ['dinners_meals', SEED_MEALS]]); }catch(e){ if(e.code==='permission-denied'){ S.status='denied'; render(); return; } }
  const err = e=>{ if(e && e.code==='permission-denied'){ S.status='denied'; render(); } };
  F.listen('dinners_guests', l=>{ S.guests=l; liveRender(); }, err);
  F.listen('dinners_meals', l=>{ S.meals=l; liveRender(); }, err);
});
render();
</script>
</body>
</html>
